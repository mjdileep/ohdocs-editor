    <g font-size="19" text-anchor="middle"><text x="263" y="114">the</text><text x="263" y="169">river</text><text x="263" y="225">bank</text></g>
    <g fill="#dae5eb"><rect x="345" y="98" width="205" height="20" rx="4"/><rect x="345" y="153" width="205" height="20" rx="4"/><rect x="345" y="209" width="205" height="20" rx="4"/></g>
    <g fill="#247887"><rect x="345" y="98" width="18.45" height="20" rx="4"/><rect x="345" y="153" width="136.33" height="20" rx="4"/><rect x="345" y="209" width="50.23" height="20" rx="4"/></g>
    <g font-size="18" font-weight="600"><text x="563" y="114">9.0%</text><text x="563" y="169">66.5%</text><text x="563" y="225">24.5%</text></g>
