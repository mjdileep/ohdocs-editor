<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 249" width="680" height="249" role="img" aria-labelledby="title desc">
  <title id="title">A Sri Lankan village tank cascade</title>
  <desc id="desc">Follow the valley downhill. The overflow of a full upper reservoir flows to a second reservoir. A sluice at the lower reservoir supplies a channel to the rice fields.</desc>
  <rect width="680" height="249" rx="14" fill="#f6f1e3"/>
  <g font-family="system-ui,sans-serif" fill="#203e35">
    <text x="22" y="35" font-size="22" font-weight="700">One valley, two village tanks</text>
    <path fill="#ccbc97" d="M12 84 Q58 110 83 122 L113 145 H183 L202 99 221 125 Q248 139 283 145 L325 166 Q364 185 408 185 H442 L466 142 490 173 Q530 188 665 201 V226 H12Z"/>
    <g fill="#67afad">
      <path d="M65 112 H197 L183 145 H113 L83 122Z"/>
      <path d="M303 156 H459 L442 185 H408 Q364 185 325 166Z"/>
    </g>
    <g stroke="#22777b" stroke-width="3" fill="none" stroke-linejoin="round">
      <path d="M65 112 H197 Q207 118 220 125 Q260 140 303 156 H459"/>
      <path d="m247 130 10 6-12 1"/>
      <path d="M447 178 L489 177 Q517 187 547 189 L639 201"/>
      <path d="m529 182 11 6-12 2"/>
    </g>
    <path d="m548 187 13-10m1 12 13-11m3 13 13-11m3 14 14-12m4 14 14-12m2 14 14-12" fill="none" stroke="#748d4b" stroke-width="3"/>
    <g font-size="18" font-weight="600">
      <text x="46" y="87">Upper tank</text><text x="336" y="133">Lower tank</text><text x="539" y="164">Rice fields</text>
    </g>
    <g stroke="#766f58" stroke-width="1.5" fill="none">
      <path d="M209 82v15l16 23"/><path d="M453 211v-16l12-14"/>
    </g>
    <text x="179" y="75" font-size="17">Spillway</text><text x="422" y="230" font-size="17">Sluice</text>
  </g>
</svg>
